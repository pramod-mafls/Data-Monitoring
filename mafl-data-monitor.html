<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MAFL Data Monitor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --maroon:#6B2328; --gold:#B4975A; --ink:#333333; --title:#A30234;
    --bg:#26282A; --panel:#333333; --panel-2:#3D4043; --line:#4A4D50;
    --text:#EDEAE3; --muted:#A39C8D;
    --bronze:#C08A5A; --silver:#9BA1A7;
    --ok:#5FBF8A; --warn:#C9AD72; --fail:#A30234; --fail-text:#E56A80;
    --radius:10px;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{font-size:15px;}
  body{
    background:var(--bg); color:var(--text);
    font-family:'Archivo', system-ui, sans-serif;
    min-height:100vh; padding:30px 32px 60px;
  }
  a{color:inherit; text-decoration:none;}
  .mono{font-family:ui-monospace, 'Cascadia Code', Consolas, monospace; font-size:.92em;}
  h2.sec{font-size:1.05rem; font-weight:700; margin:32px 0 12px; display:flex; align-items:baseline; gap:10px; color:var(--gold);}
  h2.sec .src{color:var(--muted); font-weight:400; font-size:.78rem;}

  /* ---------- Header + on-call ---------- */
  header{text-align:center; margin-bottom:20px;}
  header h1{
    font-size:2.1rem; font-weight:700; letter-spacing:-.01em;
    color:var(--gold); margin-bottom:6px;
  }
  header .sub{display:flex; justify-content:center; align-items:baseline; gap:16px; flex-wrap:wrap;}
  header .env{color:var(--muted); font-weight:500; font-size:.88rem;}
  header .refresh{color:var(--muted); font-size:.88rem;}
  header .rule{
    width:76px; height:3px; background:var(--title); border-radius:2px;
    margin:12px auto 0;
  }
  .oncall{
    display:flex; flex-wrap:wrap; align-items:center; justify-content:center; gap:10px 14px;
    background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
    padding:12px 16px; margin-bottom:26px;
  }
  .oncall .label{font-size:.8rem; font-weight:700; color:var(--gold); letter-spacing:.05em; text-transform:uppercase;}
  .oncall .person{
    display:flex; align-items:center; gap:8px;
    background:var(--panel-2); border:1px solid var(--line);
    border-radius:99px; padding:5px 14px 5px 8px; font-size:.88rem;
  }
  .oncall .person .badge{
    width:22px; height:22px; border-radius:50%; display:grid; place-items:center;
    font-size:.72rem; font-weight:700; background:var(--line); color:var(--muted);
  }
  .oncall .person.primary{border-color:var(--gold); background:#3A3226;}
  .oncall .person.primary .badge{background:var(--maroon); color:#FFF;}
  .oncall .person b{font-weight:600;}
  .oncall .person a{color:var(--muted); font-size:.82rem;}
  .oncall .person a:hover{color:var(--gold);}

  /* ---------- Layer flow ---------- */
  .flow{display:grid; grid-template-columns:1fr 44px 1fr; gap:0 14px; align-items:stretch;}
  .layer-card{
    background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
    padding:16px 20px 18px; position:relative; overflow:hidden;
  }
  .layer-card::before{content:""; position:absolute; inset:0 auto 0 0; width:4px;}
  .layer-card.bronze::before{background:linear-gradient(180deg,#C08A5A,#84582E);}
  .layer-card.silver::before{background:linear-gradient(180deg,#B4B9BE,#767C82);}
  .layer-card h2{font-size:1rem; font-weight:700; display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; color:var(--text);}
  .layer-card.bronze h2 span.dot{color:var(--bronze);}
  .layer-card.silver h2 span.dot{color:var(--silver);}
  .layer-stats{display:flex; gap:24px; margin:12px 0 12px; flex-wrap:wrap;}
  .layer-stats .stat b{font-size:1.45rem; font-weight:700; display:block; line-height:1.1;}
  .layer-stats .stat span{color:var(--muted); font-size:.78rem;}
  .stat.s-ok b{color:var(--ok);} .stat.s-fail b{color:var(--fail-text);} .stat.s-warn b{color:var(--gold);}
  .healthbar{height:8px; border-radius:4px; background:var(--panel-2); overflow:hidden; display:flex;}
  .healthbar i{display:block; height:100%;}
  .healthbar .hb-ok{background:var(--gold);} .healthbar .hb-fail{background:var(--fail);}
  .flow3{display:grid; grid-template-columns:1fr 36px 1fr 36px 1fr; gap:0 10px; align-items:stretch;}
  .flow-arrow{align-self:center; color:var(--gold); text-align:center; font-size:1.3rem; user-select:none;}
  .layer-card.gold::before{background:linear-gradient(180deg,#E3C87E,#9C7F42);}
  .layer-card.gold h2 span.dot{color:#E3C87E;}
  .layer-card h2 .src{color:var(--muted); font-weight:400; font-size:.7rem; letter-spacing:0;}
  .layer-tag.gold{color:#E3C87E;}

  /* ---------- D365 sync cards ---------- */
  .syncgrid{display:grid; grid-template-columns:repeat(auto-fit,minmax(250px,1fr)); gap:12px;}
  .synccard{
    background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
    padding:14px 16px; position:relative; overflow:hidden;
  }
  .synccard::before{content:""; position:absolute; inset:0 auto 0 0; width:4px; background:var(--gold);}
  .synccard.warn::before{background:var(--gold);}
  .synccard.crit::before{background:var(--fail);}
  .synccard h3{font-size:.88rem; font-weight:700; margin-bottom:8px; word-break:break-all; color:var(--gold);}
  .synccard .kv{display:flex; justify-content:space-between; font-size:.82rem; padding:2.5px 0;}
  .synccard .kv span{color:var(--muted);}
  .synccard .kv b{font-weight:600; font-variant-numeric:tabular-nums;}
  .synccard .kv b.w{color:var(--gold);} .synccard .kv b.c{color:var(--fail-text);} .synccard .kv b.g{color:var(--ok);}
  .synccard .lagchip{
    position:absolute; top:12px; right:12px; font-size:.72rem; font-weight:700;
    padding:2px 9px; border-radius:99px;
  }
  .lagchip.g{color:var(--ok); background:rgba(95,191,138,.14);}
  .lagchip.w{color:var(--gold); background:rgba(180,151,90,.18);}
  .lagchip.c{color:#FFF; background:var(--fail);}

  /* ---------- Controls ---------- */
  .controls{display:flex; flex-wrap:wrap; gap:10px; margin:14px 0; align-items:center;}
  .controls input[type=search]{
    flex:1 1 200px; max-width:320px; background:var(--panel); color:var(--text);
    border:1px solid var(--line); border-radius:8px; padding:8px 12px; font:inherit; font-size:.9rem;
  }
  .controls input::placeholder{color:var(--muted);}
  .controls select{
    background:var(--panel); color:var(--text); border:1px solid var(--line);
    border-radius:8px; padding:8px 10px; font:inherit; font-size:.88rem;
  }
  .seg{display:flex; border:1px solid var(--line); border-radius:8px; overflow:hidden;}
  .seg button{
    background:var(--panel); color:var(--muted); border:none; padding:8px 14px;
    font:inherit; font-size:.88rem; cursor:pointer;
  }
  .seg button + button{border-left:1px solid var(--line);}
  .seg button.active{background:var(--maroon); color:#FFF; font-weight:600;}
  .seg button:focus-visible{outline:2px solid var(--gold); outline-offset:-2px;}
  .controls .count{color:var(--muted); font-size:.86rem; margin-left:auto;}

  /* ---------- Table ---------- */
  .tablewrap{background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); overflow:auto;}
  table{width:100%; border-collapse:collapse; min-width:1080px;}
  thead th{
    text-align:left; font-size:.8rem; font-weight:700; color:var(--gold);
    padding:11px 14px; border-bottom:2px solid var(--maroon);
    position:sticky; top:0; background:var(--panel); cursor:pointer; user-select:none; white-space:nowrap;
  }
  thead th .arrow{opacity:.7; font-size:.75em;}
  tbody td{padding:10px 14px; border-bottom:1px solid var(--line); font-size:.88rem; vertical-align:top; white-space:nowrap;}
  tbody tr:last-child td{border-bottom:none;}
  tbody tr:hover td{background:var(--panel-2);}
  td.num{text-align:right; font-variant-numeric:tabular-nums;}
  th.num{text-align:right;}
  .pill{display:inline-flex; align-items:center; gap:6px; padding:3px 10px; border-radius:99px; font-size:.8rem; font-weight:600;}
  .pill::before{content:""; width:7px; height:7px; border-radius:50%; background:currentColor;}
  .pill.ok{color:var(--ok); background:rgba(95,191,138,.12);}
  .pill.fail{color:#FFF; background:var(--fail);}
  .pill.fail::before{background:#FFF;}
  .layer-tag{font-size:.8rem; font-weight:700;}
  .layer-tag.bronze{color:var(--bronze);}
  .layer-tag.silver{color:var(--silver);}
  .layer-tag.other{color:var(--muted);}
  .pipe{font-size:.76rem; color:var(--muted); display:block; margin-top:2px;}
  .stale{color:var(--gold); font-size:.78rem; display:block; margin-top:2px; white-space:normal;}
  .err{color:var(--fail-text); font-size:.8rem; max-width:360px; display:block; white-space:normal;}
  .muted{color:var(--muted);}
  .var-pos{color:var(--ok); font-size:.8rem;} .var-neg{color:var(--fail-text); font-size:.8rem;} .var-zero{color:var(--muted); font-size:.8rem;}
  .files{font-size:.8rem; color:var(--muted);} .files.partial{color:var(--gold); font-weight:700;}
  .empty{padding:40px; text-align:center; color:var(--muted);}

  @media (max-width:760px){
    body{padding:16px 12px 50px;}
    header h1{font-size:1.6rem;}
    .flow{grid-template-columns:1fr; gap:10px;}
    .flow3{grid-template-columns:1fr; gap:10px;}
    .flow-arrow{transform:rotate(90deg); padding:2px 0;}
  }
  @media (prefers-reduced-motion:no-preference){ .healthbar i{transition:width .5s ease;} }
</style>
</head>
<body>

<header>
  <h1>MAFL Data Monitor</h1>
  <div class="sub">
    <span class="env mono">mafl_data_load_log</span>
    <span class="refresh" id="lastRefresh">Data as of &#8212;</span>
  </div>
  <div class="rule"></div>
</header>

<div class="oncall" id="oncall"></div>

<h2 class="sec" style="margin-top:0">D365 sync health <span class="src mono">refresh_alert_d365</span></h2>
<div class="syncgrid" id="syncgrid"></div>

<h2 class="sec">Bronze, Silver &amp; Gold</h2>
<div class="flow3" id="layers3"></div>

<h2 class="sec">dbt warehouse builds <span class="src mono">dbt Cloud</span></h2>
<div class="syncgrid" id="dbtgrid"></div>

<h2 class="sec">Table loads <span class="src mono">latest run per pipeline &amp; table</span></h2>
<div class="controls">
  <input type="search" id="search" placeholder="Search table name&#8230;" aria-label="Search table name">
  <select id="srcSel" aria-label="Filter by source system"><option value="all">All sources</option></select>
  <div class="seg" id="layerSeg" role="group" aria-label="Filter by layer">
    <button data-v="all" class="active" type="button">All layers</button>
    <button data-v="bronze" type="button">Bronze</button>
    <button data-v="silver" type="button">Silver</button>
    <button data-v="gold" type="button">Gold</button>
  </div>
  <div class="seg" id="statusSeg" role="group" aria-label="Filter by status">
    <button data-v="all" class="active" type="button">All</button>
    <button data-v="Success" type="button">Success</button>
    <button data-v="Failure" type="button">Failure</button>
  </div>
  <span class="count" id="rowCount"></span>
</div>

<div class="tablewrap">
  <table id="grid">
    <thead>
      <tr>
        <th data-k="layer">Layer <span class="arrow"></span></th>
        <th data-k="Fabric_Table_Name">Table <span class="arrow"></span></th>
        <th data-k="Status">Status <span class="arrow"></span></th>
        <th data-k="Start_DateTime">Last run <span class="arrow"></span></th>
        <th data-k="Execution_Time_In_Minutes" class="num">Minutes <span class="arrow"></span></th>
        <th data-k="Rows_Count_After_Processing" class="num">Rows after <span class="arrow"></span></th>
        <th data-k="Rows_Count_Variance" class="num">Variance <span class="arrow"></span></th>
        <th data-k="Files_Processed" class="num">Files <span class="arrow"></span></th>
        <th data-k="Comment">Comment <span class="arrow"></span></th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>
  <div class="empty" id="empty" hidden>No loads match the current filters.</div>
</div>

/* ---------- config ---------- */
const STALE_HOURS = 26;
const SYNC_WARN_H = 2, SYNC_CRIT_H = 6;

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const fmtInt = n => (n == null || n === "") ? "\u2014" : Number(n).toLocaleString("en-US");
const parseDT = s => s ? new Date(String(s).slice(0,19).replace(" ","T")) : null;
const fmtDT = s => {
  const d = parseDT(s); if(!d || isNaN(d)) return "\u2014";
  return d.toLocaleString("en-GB",{day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit"});
};
const fmtMins = m => {
  if(m == null || m === "") return "\u2014";
  const v = Number(m);
  return v < 1 ? Math.round(v*60)+"s" : v.toFixed(1)+"m";
};
const fmtPhone = p => {
  const s = String(p);
  return s.startsWith("971") ? "+971 " + s.slice(3,5) + " " + s.slice(5,8) + " " + s.slice(8) : s;
};
const layerOf = r => {
  const t = String(r.Target_Lakehouse||"");
  return /bronze/i.test(t) ? "bronze" : /silver/i.test(t) ? "silver"
       : /warehouse|gold/i.test(t) ? "gold" : "other";
};
const isStale = r => { const d = parseDT(r.Start_DateTime); return d && (Date.now()-d) > STALE_HOURS*3600e3; };
const lagClass = h => h >= SYNC_CRIT_H ? "c" : h >= SYNC_WARN_H ? "w" : "g";

/* latest run per (Source_System, Target_Lakehouse, Fabric_Table_Name) */
function latestOnly(data){
  const m = new Map();
  for(const r of data){
    const k = r.Source_System+"|"+r.Target_Lakehouse+"|"+r.Fabric_Table_Name;
    if(!m.has(k) || String(r.Start_DateTime) > String(m.get(k).Start_DateTime)) m.set(k, r);
  }
  return [...m.values()];
}

let rows = [];
let sortKey = "layer", sortDir = 1;
let fLayer = "all", fStatus = "all", fText = "", fSrc = "all";

/* ---------- on-call ---------- */
function renderOncall(){
  const list = [...ONCALL_DATA].sort((a,b)=>a.Rank-b.Rank);
  $("#oncall").innerHTML = '<span class="label">On call</span>' + list.map((p,i)=>
    '<span class="person'+(i===0?' primary':'')+'">'+
      '<span class="badge">'+p.Rank+'</span><b>'+esc(p.Name)+'</b>'+
      '<a href="tel:+'+esc(p.Phone_Number)+'">'+fmtPhone(p.Phone_Number)+'</a>'+
    '</span>').join("");
}

/* ---------- D365 sync ---------- */
function renderSync(){
  $("#syncgrid").innerHTML = D365_SYNC_DATA.map(t=>{
    const diff = Number(t.Source_Count) - Number(t.Fabric_Silver_Count);
    const worst = Math.max(Number(t.SyncDelay_ADLS_to_Fabric_Hours)||0, Number(t.SyncDelay_D365_to_ADLS_Hours_Actual)||0);
    const cls = lagClass(worst);
    return '<div class="synccard '+(cls==="c"?"crit":cls==="w"?"warn":"")+'">'+
      '<h3 class="mono">'+esc(t.Table_Name)+'</h3>'+
      '<div class="kv"><span>Source rows</span><b>'+fmtInt(t.Source_Count)+'</b></div>'+
      '<div class="kv"><span>Fabric rows</span><b>'+fmtInt(t.Fabric_Silver_Count)+
        (diff!==0? ' <span class="'+(Math.abs(diff)>10000?"c":"w")+'" style="font-weight:600">('+(diff>0?"-":"+")+fmtInt(Math.abs(diff))+')</span>':'')+'</b></div>'+
      '<div class="kv"><span>D365 \u2192 ADLS</span><b class="'+lagClass(t.SyncDelay_D365_to_ADLS_Hours_Actual)+'">'+Number(t.SyncDelay_D365_to_ADLS_Hours_Actual).toFixed(2)+' h</b></div>'+
      '<div class="kv"><span>ADLS \u2192 Fabric</span><b class="'+lagClass(t.SyncDelay_ADLS_to_Fabric_Hours)+'">'+Number(t.SyncDelay_ADLS_to_Fabric_Hours).toFixed(2)+' h</b></div>'+
      '<div class="kv"><span>Latest in Fabric</span><b>'+fmtDT(t.Fabric_Silver_Max_DateTime)+'</b></div>'+
      '<div class="kv"><span>Checked at</span><b>'+fmtDT(t.This_Table_Calculated_On)+'</b></div>'+
    '</div>';
  }).join("");
}

/* ---------- dbt builds ---------- */
function renderDbt(){
  if(!Array.isArray(DBT_DATA) || !DBT_DATA.length){
    $("#dbtgrid").innerHTML = '<div class="synccard"><div class="kv"><span>No dbt runs found</span></div></div>';
    return;
  }
  $("#dbtgrid").innerHTML = DBT_DATA.map(j=>{
    const st = j.Status || "";
    const cls = st==="Success" ? "" : st==="Failure" ? "crit" : "warn";
    const pill = st==="Success" ? "ok" : st==="Failure" ? "fail" : "ok";
    const models = (j.Models_Success!=null)
      ? '<div class="kv"><span>Models</span><b><span class="g">'+fmtInt(j.Models_Success)+' ok</span>'+
        (j.Models_Warn? ' \u00B7 <span class="w">'+fmtInt(j.Models_Warn)+' warn</span>':'')+
        (j.Models_Error? ' \u00B7 <span class="c">'+fmtInt(j.Models_Error)+' error</span>':'')+'</b></div>'
      : '';
    return '<div class="synccard '+cls+'">'+
      '<h3>'+esc(j.Job_Name)+'</h3>'+
      '<div class="kv"><span>Status</span><b><span class="pill '+pill+'">'+esc(st)+'</span></b></div>'+
      models+
      '<div class="kv"><span>Started</span><b>'+fmtDT(j.Started_At)+'</b></div>'+
      '<div class="kv"><span>Finished</span><b>'+fmtDT(j.Finished_At)+'</b></div>'+
      '<div class="kv"><span>Duration</span><b>'+esc(j.Duration||"\u2014")+'</b></div>'+
    '</div>';
  }).join("");
}

/* ---------- Bronze / Silver / Gold summary ---------- */
const fmtTotalMins = m => {
  if(!m) return "0m";
  const h = Math.floor(m/60), mm = Math.round(m%60);
  return h ? h+"h "+mm+"m" : mm+"m";
};

function layer3CardHTML(cls, title, sub, stats){
  return '<div class="layer-card '+cls+'">'+
    '<h2><span class="dot">\u25CF</span> '+title+' <span class="src mono">'+sub+'</span></h2>'+
    '<div class="layer-stats">'+
      '<div class="stat"><b>'+stats.tables+'</b><span>tables</span></div>'+
      '<div class="stat s-ok"><b>'+stats.ok+'</b><span>success</span></div>'+
      '<div class="stat s-fail"><b>'+stats.fail+'</b><span>failure</span></div>'+
      '<div class="stat"><b>'+fmtTotalMins(stats.mins)+'</b><span>total time</span></div>'+
    '</div></div>';
}

function renderLayers3(){
  const stats = layer => {
    const set = rows.filter(r=>layerOf(r)===layer);
    return {
      tables: set.length,
      ok: set.filter(r=>r.Status==="Success").length,
      fail: set.filter(r=>r.Status!=="Success").length,
      mins: set.reduce((a,r)=>a+(Number(r.Execution_Time_In_Minutes)||0),0),
    };
  };
  const gold = {tables:0, ok:0, fail:0, mins:0};
  (Array.isArray(DBT_DATA)?DBT_DATA:[]).forEach(j=>{
    gold.ok   += Number(j.Models_Success)||0;
    gold.fail += Number(j.Models_Error)||0;
    gold.tables += (Number(j.Models_Success)||0)+(Number(j.Models_Warn)||0)+(Number(j.Models_Error)||0);
    const s = parseDT(j.Started_At), e = parseDT(j.Finished_At);
    if(s && e && !isNaN(s) && !isNaN(e)) gold.mins += (e-s)/60000;
  });
  const goldStats = stats("gold").tables ? stats("gold") : gold;   // prefer grid rows, fall back to DBT_DATA
  $("#layers3").innerHTML =
    layer3CardHTML("bronze","Bronze","MAFL_PROD_Bronze_Lakehouse",stats("bronze"))+
    '<div class="flow-arrow" aria-hidden="true">\u279C</div>'+
    layer3CardHTML("silver","Silver","MAFL_PROD_Silver_Lakehouse",stats("silver"))+
    '<div class="flow-arrow" aria-hidden="true">\u279C</div>'+
    layer3CardHTML("gold","Gold","MAFL_PROD_Warehouse",goldStats);
}

/* ---------- grid ---------- */
function renderGrid(){
  let view = rows.filter(r =>
    (fLayer==="all" || layerOf(r)===fLayer) &&
    (fStatus==="all" || r.Status===fStatus) &&
    (fSrc==="all" || r.Source_System===fSrc) &&
    (!fText || String(r.Fabric_Table_Name).toLowerCase().includes(fText))
  );
  view.sort((a,b)=>{
    let av, bv;
    if(sortKey==="layer"){ av=layerOf(a); bv=layerOf(b); }
    else if(["Execution_Time_In_Minutes","Rows_Count_After_Processing","Rows_Count_Variance","Files_Processed"].includes(sortKey)){
      av=a[sortKey]==null?-1:Number(a[sortKey]); bv=b[sortKey]==null?-1:Number(b[sortKey]);
    } else { av=(a[sortKey]??"")+""; bv=(b[sortKey]??"")+""; }
    return (av<bv?-1:av>bv?1:0)*sortDir;
  });
  $("#tbody").innerHTML = view.map(r=>{
    const lyr = layerOf(r);
    const v = r.Rows_Count_Variance;
    const vCls = v>0? "var-pos" : v<0? "var-neg" : "var-zero";
    const vTxt = v==null? "\u2014" : (v>0? "+" : "")+fmtInt(v);
    let files = '<span class="muted">\u2014</span>';
    if(r.Files_Processed != null && r.Files_To_Be_Processed != null){
      const partial = Number(r.Files_Processed) < Number(r.Files_To_Be_Processed);
      files = '<span class="files'+(partial?' partial':'')+'">'+r.Files_Processed+' / '+r.Files_To_Be_Processed+'</span>';
    }
    const comment = r.Status==="Success"
      ? '<span class="muted">'+esc(r.Comment||"\u2014")+'</span>'
      : '<span class="err">'+esc(r.Comment||"\u2014")+'</span>';
    return '<tr>'+
      '<td><span class="layer-tag '+lyr+'">'+lyr[0].toUpperCase()+lyr.slice(1)+'</span>'+
        '<span class="pipe">'+esc(r.Source_System)+'</span></td>'+
      '<td class="mono">'+esc(r.Fabric_Table_Name)+'</td>'+
      '<td><span class="pill '+(r.Status==="Success"?"ok":"fail")+'">'+esc(r.Status)+'</span></td>'+
      '<td>'+fmtDT(r.Start_DateTime)+(isStale(r)?'<span class="stale">stale \u2014 no run in '+STALE_HOURS+'h</span>':'')+'</td>'+
      '<td class="num">'+fmtMins(r.Execution_Time_In_Minutes)+'</td>'+
      '<td class="num">'+fmtInt(r.Rows_Count_After_Processing)+'</td>'+
      '<td class="num '+vCls+'">'+vTxt+'</td>'+
      '<td class="num">'+files+'</td>'+
      '<td style="white-space:normal">'+comment+'</td>'+
    '</tr>';
  }).join("");
  $("#empty").hidden = view.length>0;
  $("#rowCount").textContent = view.length + " of " + rows.length + " tables";
  document.querySelectorAll("thead th").forEach(th=>{
    th.querySelector(".arrow").textContent = th.dataset.k===sortKey ? (sortDir===1?"\u25B2":"\u25BC") : "";
  });
}

function renderAll(){
  rows = latestOnly(LOAD_DATA);
  renderOncall();
  renderSync();
  renderDbt();
  const srcs = [...new Set(rows.map(r=>r.Source_System))].sort();
  $("#srcSel").innerHTML = '<option value="all">All sources</option>' +
    srcs.map(s=>'<option value="'+esc(s)+'">'+esc(s)+'</option>').join("");
  renderLayers3();
  renderGrid();
  const newest = rows.map(r=>r.Start_DateTime).filter(Boolean).sort().pop();
  $("#lastRefresh").textContent = "Data as of " + (newest? fmtDT(newest) : "\u2014");
}

/* ---------- events ---------- */
function segWire(id, setter){
  $("#"+id).addEventListener("click", e=>{
    const b = e.target.closest("button"); if(!b) return;
    document.querySelectorAll("#"+id+" button").forEach(x=>x.classList.remove("active"));
    b.classList.add("active");
    setter(b.dataset.v); renderGrid();
  });
}
segWire("layerSeg", v=>fLayer=v);
segWire("statusSeg", v=>fStatus=v);
$("#srcSel").addEventListener("change", e=>{ fSrc=e.target.value; renderGrid(); });
$("#search").addEventListener("input", e=>{ fText=e.target.value.trim().toLowerCase(); renderGrid(); });
document.querySelector("thead").addEventListener("click", e=>{
  const th = e.target.closest("th"); if(!th) return;
  if(sortKey===th.dataset.k) sortDir*=-1; else { sortKey=th.dataset.k; sortDir=1; }
  renderGrid();
});

renderAll();
</script>
</body>
</html>
